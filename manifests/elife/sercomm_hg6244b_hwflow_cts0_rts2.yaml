name: Sercomm HG6244B Zigbee Router CTS0 RTS2
device: EFR32MG21A010F512IM32
base_project: src/zigbee_router
filename: "{manifest_name}_{sdk_version}_{fw_version}_{baudrate}_{fw_variant}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "gcc:14.2.1"

gbl:
  fw_type: zigbee_router
  baudrate: 115200
  fw_variant: hw_cts0_rts2

add_components:
  - id: cli
    instance:
      - inst
  - id: iostream_retarget_stdio

c_defines:
  SL_CLI_INST_IOSTREAM_HANDLE: sl_iostream_vcom_handle
  SL_IOSTREAM_USART_VCOM_RESTRICT_ENERGY_MODE_TO_ALLOW_RECEPTION: 1
  SL_IOSTREAM_USART_VCOM_BAUDRATE: 115200
  SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: usartHwFlowControlCtsAndRts

  SL_IOSTREAM_USART_VCOM_PERIPHERAL: USART0
  SL_IOSTREAM_USART_VCOM_PERIPHERAL_NO: 0

  SL_IOSTREAM_USART_VCOM_TX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_USART_VCOM_TX_PIN:  5

  SL_IOSTREAM_USART_VCOM_RX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_USART_VCOM_RX_PIN:  6

  SL_IOSTREAM_USART_VCOM_CTS_PORT: SL_GPIO_PORT_D
  SL_IOSTREAM_USART_VCOM_CTS_PIN:  0

  SL_IOSTREAM_USART_VCOM_RTS_PORT: SL_GPIO_PORT_D
  SL_IOSTREAM_USART_VCOM_RTS_PIN:  2

  SL_CLOCK_MANAGER_HFXO_CTUNE: 128
  SL_CLOCK_MANAGER_HFXO_FREQ: 38400000
  SL_CLOCK_MANAGER_HFXO_PRECISION: 10

  SL_RAIL_UTIL_RSSI_OFFSET: -11
